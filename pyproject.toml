[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subtrack"
version = "0.1.0"
description = "Local-first tracker that finds recurring subscriptions in your bank statements"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["typer>=0.12", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[project.scripts]
subtrack = "subtrack.cli:app"